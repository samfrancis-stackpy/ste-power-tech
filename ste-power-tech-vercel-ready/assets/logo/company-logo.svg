<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 590 570" width="590" height="570" fill="none">
  <defs>
    <!-- Background Gradient matching #101B32 -->
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#14223E"/>
      <stop offset="100%" stop-color="#0A1120"/>
    </radialGradient>
    <filter id="subtle-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="590" height="570" rx="40" fill="url(#bg-glow)"/>

  <!-- Outer Dotted Oval Border -->
  <ellipse cx="295" cy="285" rx="265" ry="245" 
           stroke="#FFFFFF" stroke-width="4.5" 
           stroke-dasharray="7 11" stroke-linecap="round" opacity="0.95"/>

  <!-- Left: Multi-Arc Power Vortex / Turbine Swirl -->
  <g stroke="#FFFFFF" fill="none" stroke-linecap="round" opacity="0.95">
    <!-- Concentric blade/crescent arcs -->
    <path d="M 160 395 C 105 380, 52 315, 62 230 C 72 155, 140 105, 230 110 C 265 112, 305 130, 315 155" stroke-width="8.5"/>
    <path d="M 145 382 C 100 365, 66 312, 75 242 C 84 175, 148 128, 225 132 C 255 134, 285 148, 298 172" stroke-width="7.5"/>
    <path d="M 132 365 C 96 348, 78 305, 88 250 C 96 195, 150 152, 215 155 C 242 157, 268 170, 278 190" stroke-width="6.5"/>
    <path d="M 122 342 C 95 325, 90 292, 100 252 C 110 210, 155 178, 205 180 C 228 182, 248 195, 256 210" stroke-width="5.5"/>
    <path d="M 115 315 C 100 298, 102 272, 112 245 C 122 215, 158 198, 195 200 C 214 202, 228 214, 235 228" stroke-width="4.5"/>
    <path d="M 112 285 C 108 270, 115 252, 126 235 C 138 215, 165 212, 185 218 C 196 222, 206 232, 210 242" stroke-width="3.5"/>
  </g>

  <!-- Right: Technician Icon -->
  <g transform="translate(365, 172)" stroke="#FFFFFF" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Hard Hat / Helmet -->
    <path d="M 22 28 C 22 14, 34 6, 50 6 C 66 6, 78 14, 78 28 Z" fill="rgba(255,255,255,0.08)"/>
    <path d="M 16 28 L 84 28" stroke-width="4.5"/>
    <path d="M 42 6 L 42 16" stroke-width="3.5"/>
    <path d="M 58 6 L 58 16" stroke-width="3.5"/>

    <!-- Head & Ears -->
    <path d="M 28 28 L 28 42 C 28 54, 40 60, 50 60 C 60 60, 72 54, 72 42 L 72 28"/>
    <path d="M 24 35 L 28 35"/>
    <path d="M 72 35 L 76 35"/>

    <!-- Collar & Shirt Neck -->
    <path d="M 40 60 L 50 72 L 60 60"/>

    <!-- Uniform Shoulders & Chest -->
    <path d="M 14 74 L 14 102 L 86 102 L 86 74 C 86 66, 74 62, 60 60 L 40 60 C 26 62, 14 66, 14 74 Z" fill="rgba(255,255,255,0.06)"/>
    
    <!-- Chest Pocket & ID lines -->
    <line x1="24" y1="84" x2="38" y2="84" stroke-width="3"/>
    <line x1="62" y1="84" x2="76" y2="84" stroke-width="3"/>
    <line x1="50" y1="72" x2="50" y2="102" stroke-width="3"/>

    <!-- Gear / Cog Base beneath Technician -->
    <g transform="translate(0, 96)">
      <path d="M 24 6 L 30 18 L 40 18 L 44 26 L 56 26 L 60 18 L 70 18 L 76 6" stroke-width="4"/>
      <path d="M 32 18 L 32 26 L 40 32 L 60 32 L 68 26 L 68 18" stroke-width="3.5"/>
      <circle cx="50" cy="18" r="8" stroke-width="3.5"/>
    </g>
  </g>

  <!-- Right: Lightning Power Bolt -->
  <g transform="translate(458, 172)" stroke="#FFFFFF" stroke-width="4.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 38 4 L 14 42 L 32 42 L 18 78 L 56 34 L 38 34 Z" fill="rgba(255, 122, 50, 0.15)"/>
  </g>

  <!-- Brand Typography: STE POWER TECH -->
  <text x="182" y="348" 
        font-family="'Space Grotesk', 'Inter', 'Poppins', -apple-system, sans-serif" 
        font-size="36" 
        font-weight="700" 
        letter-spacing="4.5" 
        fill="#FFFFFF">
    STE POWER TECH
  </text>

  <!-- Bottom Dotted Line Underline -->
  <line x1="182" y1="395" x2="535" y2="395" 
        stroke="#FFFFFF" stroke-width="4.5" 
        stroke-dasharray="6 10" stroke-linecap="round" opacity="0.95"/>
</svg>

