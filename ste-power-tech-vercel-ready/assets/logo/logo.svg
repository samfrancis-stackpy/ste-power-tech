<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 88" width="460" height="88" fill="none">
  <defs>
    <radialGradient id="emblem-bg" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#142442"/>
      <stop offset="100%" stop-color="#0A1120"/>
    </radialGradient>
    <filter id="logo-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#101B32" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Left: Official Company Emblem Badge -->
  <g transform="translate(4, 4)" filter="url(#logo-shadow)">
    <!-- Badge Background -->
    <rect width="80" height="80" rx="20" fill="url(#emblem-bg)"/>
    <rect width="80" height="80" rx="20" stroke="#1769AA" stroke-width="1.5" opacity="0.6"/>

    <!-- Scaled Official Logo Elements inside Badge -->
    <g transform="translate(40, 40) scale(0.125) translate(-295, -285)">
      <!-- Outer Dotted Oval Border -->
      <ellipse cx="295" cy="285" rx="260" ry="240" 
               stroke="#FFFFFF" stroke-width="7" 
               stroke-dasharray="10 14" stroke-linecap="round"/>

      <!-- Power Vortex Arcs -->
      <g stroke="#FFFFFF" fill="none" stroke-linecap="round">
        <path d="M 160 395 C 105 380, 52 315, 62 230 C 72 155, 140 105, 230 110 C 265 112, 305 130, 315 155" stroke-width="14"/>
        <path d="M 145 382 C 100 365, 66 312, 75 242 C 84 175, 148 128, 225 132 C 255 134, 285 148, 298 172" stroke-width="12"/>
        <path d="M 132 365 C 96 348, 78 305, 88 250 C 96 195, 150 152, 215 155 C 242 157, 268 170, 278 190" stroke-width="10"/>
        <path d="M 122 342 C 95 325, 90 292, 100 252 C 110 210, 155 178, 205 180 C 228 182, 248 195, 256 210" stroke-width="8"/>
      </g>

      <!-- Technician Icon -->
      <g transform="translate(365, 172)" stroke="#FFFFFF" stroke-width="6.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M 22 28 C 22 14, 34 6, 50 6 C 66 6, 78 14, 78 28 Z" fill="rgba(255,255,255,0.2)"/>
        <path d="M 16 28 L 84 28" stroke-width="7.5"/>
        <path d="M 28 28 L 28 42 C 28 54, 40 60, 50 60 C 60 60, 72 54, 72 42 L 72 28"/>
        <path d="M 14 74 L 14 102 L 86 102 L 86 74 C 86 66, 74 62, 60 60 L 40 60 C 26 62, 14 66, 14 74 Z" fill="rgba(255,255,255,0.15)"/>
        <!-- Gear -->
        <g transform="translate(0, 96)">
          <path d="M 24 6 L 30 18 L 40 18 L 44 26 L 56 26 L 60 18 L 70 18 L 76 6" stroke-width="6"/>
          <circle cx="50" cy="18" r="8" stroke-width="6"/>
        </g>
      </g>

      <!-- Lightning Power Bolt -->
      <g transform="translate(465, 172)" stroke="#FF7A32" stroke-width="7" fill="#FF7A32" stroke-linecap="round" stroke-linejoin="round">
        <path d="M 38 4 L 14 42 L 32 42 L 18 78 L 56 34 L 38 34 Z"/>
      </g>

      <!-- Bottom Dotted Line -->
      <line x1="182" y1="395" x2="535" y2="395" 
            stroke="#FFFFFF" stroke-width="7" 
            stroke-dasharray="10 14" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Right: Company Typography Lockup -->
  <g transform="translate(98, 16)">
    <!-- STE Text -->
    <text x="0" y="34" font-family="'Space Grotesk', 'Poppins', -apple-system, sans-serif" font-size="34" font-weight="900" letter-spacing="1.5" fill="#101B32">
      STE
    </text>
    
    <!-- POWER TECH Text -->
    <text x="76" y="34" font-family="'Space Grotesk', 'Poppins', -apple-system, sans-serif" font-size="32" font-weight="800" letter-spacing="1" fill="#1769AA">
      POWER<tspan fill="#FF7A32">TECH</tspan>
    </text>
    
    <!-- Subtitle / Business Type -->
    <text x="2" y="55" font-family="'Inter', 'Manrope', -apple-system, sans-serif" font-size="9.5" font-weight="700" letter-spacing="3" fill="#5A6E85">
      ELECTRICAL SERVICES &amp; MAINTENANCE
    </text>

    <!-- Accent dot -->
    <circle cx="298" cy="52" r="2.5" fill="#FF7A32"/>
  </g>
</svg>
